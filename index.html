<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conceptarium</title>
  <meta name="description" content="Conceptarium: interactive 3D visualizations of engineering concepts that are hard to imagine: engineering drawing, mechanics, mathematics, computer graphics, machine learning and data structures.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script type="importmap">

      "imports": {

      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="logo" aria-hidden="true">✦</span><span class="brand-name">Concept<em>arium</em></span></a>
