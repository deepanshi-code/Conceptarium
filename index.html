<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conceptarium</title>
  <meta name="description" content="Learn engineering concepts by moving them in 3D: 58 interactive models with practice problems and quizzes for B.Tech and BCA students. Free, no sign-up.">
  <meta name="theme-color" content="#12173c">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="canonical" href="https://deepanshi-code.github.io/Conceptarium/">
  <!-- Link previews (WhatsApp, LinkedIn, X, Slack…). Image URLs must be absolute. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Conceptarium">
  <meta property="og:title" content="Conceptarium: learn engineering concepts by moving them in 3D">
  <meta property="og:description" content="58 interactive 3D models with practice problems and quizzes for B.Tech and BCA students. Free, no sign-up.">
  <meta property="og:url" content="https://deepanshi-code.github.io/Conceptarium/">
  <meta property="og:image" content="https://deepanshi-code.github.io/Conceptarium/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Conceptarium: learn engineering concepts by moving them in 3D">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load without holding up the page (text shows in a system font for a moment, then swaps). -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap"></noscript>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- Start downloading the 3D library right away instead of after main.js and its imports have loaded. -->
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Opening the home page plays the welcome intro: keep the page itself hidden until the intro covers it,
    // so the home page never flashes first. (welcome.js lifts this; the timer is only a safety net.)
    if (/^(#\/?)?$/.test(location.hash)) {
      document.documentElement.classList.add('intro');
      setTimeout(() => document.documentElement.classList.remove('intro'), 8000);
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button class="skip-link" type="button" onclick="document.getElementById('app').focus()">Skip to content</button>
  <header class="topbar">
    <a href="#/" class="brand"><span class="logo" aria-hidden="true">✦</span><span class="brand-name">Concept<em>arium</em></span></a>
    <nav class="crumbs" data-crumbs aria-label="Breadcrumb"></nav>
    <div class="top-actions">
      <button class="nav-btn ghost install-btn" type="button" data-install hidden title="Install Conceptarium as an app: opens from your home screen and works offline">⤓ <span>Install app</span></button>
      <button class="nav-btn ghost ask-btn" data-ask-open title="Ask a question about any concept">✦ <span>Ask</span></button>
      <button class="nav-btn ghost search-btn" data-search-open title="Quick search (Ctrl K)">⌕ <span>Search</span> <kbd>Ctrl K</kbd></button>
      <a class="nav-btn concept-only" data-prev aria-label="Previous concept">←</a>
      <a class="nav-btn concept-only next" data-next></a>
      <a class="nav-btn ghost" href="#/">All concepts</a>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <script type="module" src="js/boot.js" async></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
